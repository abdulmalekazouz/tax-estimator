[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "taxestimator"
version = "0.1.0"
description = "A U.S. federal income tax estimator: library, CLI, and web UI"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "Abdulmalek Azouz" }]
keywords = ["tax", "finance", "irs", "income-tax", "cli", "flask"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Financial and Insurance Industry",
    "Topic :: Office/Business :: Financial",
]
dependencies = [
    "pydantic>=2.4,<3",
    "tabulate>=0.9,<1",
    "Flask>=3.0,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[project.scripts]
taxestimator = "taxestimator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
taxestimator = ["templates/*.html", "static/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"
